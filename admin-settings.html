<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Settings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #087f23;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #e8f5e9;
      color: #087f23;
      text-align: center;
      font-weight: bold;
    }

    .payment-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #087f23;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Admin Settings</h1>

    <label>Customer Name</label>

    <input
      type="text"
      id="customerName"
      placeholder="Enter Customer Name"
    >

    <label>Amount ₹</label>

    <input
      type="number"
      id="defaultAmount"
      placeholder="Enter Amount"
      min="1"
    >

    <label>UPI ID</label>

    <input
      type="text"
      id="upiId"
      placeholder="example@upi"
    >

    <label>Site Name</label>

    <input
      type="text"
      id="siteName"
      placeholder="Payment"
    >

    <button onclick="saveSettings()">
      Save Settings
    </button>

    <div id="message" class="message">
      Settings Saved Successfully
    </div>

    <a
      class="payment-link"
      href="payment.html"
    >
      Open Payment Page
    </a>

  </div>

  <script>

    // पहले से saved data दिखाना
    document.getElementById("customerName").value =
      localStorage.getItem("customerName") || "";

    document.getElementById("defaultAmount").value =
      localStorage.getItem("defaultAmount") || "";

    document.getElementById("upiId").value =
      localStorage.getItem("upiId") || "";

    document.getElementById("siteName").value =
      localStorage.getItem("siteName") || "";

    function saveSettings() {

      const customerName =
        document.getElementById("customerName")
          .value.trim();

      const amount =
        document.getElementById("defaultAmount")
          .value;

      const upiId =
        document.getElementById("upiId")
          .value.trim();

      const siteName =
        document.getElementById("siteName")
          .value.trim();

      if (!customerName) {
        alert("Please enter customer name.");
        return;
      }

      if (!amount || Number(amount) <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      if (!upiId) {
        alert("Please enter UPI ID.");
        return;
      }

      localStorage.setItem(
        "customerName",
        customerName
      );

      localStorage.setItem(
        "defaultAmount",
        amount
      );

      localStorage.setItem(
        "upiId",
        upiId
      );

      localStorage.setItem(
        "siteName",
        siteName
      );

      document.getElementById("message")
        .style.display = "block";

      setTimeout(function() {
        document.getElementById("message")
          .style.display = "none";
      }, 2500);
    }

  </script>

</body>
</html>
