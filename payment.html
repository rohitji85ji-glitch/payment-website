<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UPI Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 40px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    h2 {
      margin-top: 5px;
    }

    p {
      color: #555;
    }

    .info-box {
      margin-top: 20px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 12px;
      text-align: left;
    }

    .info-row {
      margin: 10px 0;
      font-size: 17px;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      color: #087f23;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #087f23;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .close-btn {
      background: #555;
    }

    .qr-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    #qrCode {
      width: 240px;
      max-width: 100%;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .upi {
      font-weight: bold;
      margin-top: 12px;
      word-break: break-all;
    }

    .payment-message {
      color: #333;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
      margin-top: 15px;
    }

    .timer {
      color: #c00000;
      font-weight: bold;
      font-size: 17px;
    }

    .note {
      color: #666;
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 id="siteName">Make Payment</h1>

    <p>Make payment using UPI</p>

    <!-- PAYMENT DETAILS -->
    <div class="info-box">

      <div class="info-row">
        <strong>Customer:</strong>
        <span id="customerName"></span>
      </div>

      <div class="info-row">
        <strong>Amount:</strong>
        <span id="amount" class="amount"></span>
      </div>

    </div>


    <!-- CONTINUE BUTTON -->
    <button class="btn" onclick="continuePayment()">
      Continue Payment
    </button>


    <!-- QR PAYMENT BOX -->
    <div id="qrBox" class="qr-box">

      <h2>Scan & Pay</h2>

      <div id="amountText" class="amount"></div>

      <br>

      <img
        id="qrCode"
        alt="UPI QR Code"
      >

      <div
        id="upiText"
        class="upi">
      </div>


      <p class="payment-message">
        Please complete your payment within 2 minutes.
      </p>


      <p id="timer" class="timer">
        QR Code will close automatically in 2:00
      </p>


      <p class="note">
        अपने UPI App में QR Code scan करके payment करें।
        Payment को अपने UPI App में खुद approve करें।
        UPI PIN/OTP केवल अपने UPI App में ही डालें।
      </p>


      <!-- CLOSE ONLY -->
      <button
        class="btn close-btn"
        onclick="paymentFinished()">
        Close QR
      </button>

    </div>


    <!-- STATUS -->
    <div
      id="status"
      class="status">
    </div>

  </div>


  <script>

    /*
      ADMIN SETTINGS से DATA
    */

    const customerName =
      localStorage.getItem("customerName");

    const siteName =
      localStorage.getItem("siteName");

    const upiId =
      localStorage.getItem("upiId");

    const savedAmount =
      localStorage.getItem("defaultAmount");


    /*
      TIMER
    */

    let qrTimer = null;

    let remainingSeconds = 120;


    /*
      CUSTOMER NAME
    */

    document.getElementById("customerName").textContent =
      customerName || "Customer";


    /*
      SITE NAME
    */

    if (siteName) {

      document.getElementById("siteName").textContent =
        siteName;

    }


    /*
      AMOUNT
    */

    if (savedAmount) {

      const amount = Number(savedAmount);

      if (amount > 0) {

        document.getElementById("amount").textContent =
          "₹" + amount.toFixed(2);

      } else {

        document.getElementById("amount").textContent =
          "Amount not set";

      }

    } else {

      document.getElementById("amount").textContent =
        "Amount not set";

    }


    /*
      CREATE UPI PAYMENT LINK
    */

    function createUPILink() {

      const amount =
        Number(savedAmount);


      if (!upiId) {
        return null;
      }


      if (!amount || amount <= 0) {
        return null;
      }


      const upiLink =
        "upi://pay" +
        "?pa=" +
        encodeURIComponent(upiId) +
        "&pn=" +
        encodeURIComponent(siteName || "Payment") +
        "&am=" +
        encodeURIComponent(amount.toFixed(2)) +
        "&cu=INR";


      return upiLink;

    }


    /*
      CONTINUE PAYMENT
    */

    function continuePayment() {

      /*
        CUSTOMER CHECK
      */

      if (!customerName) {

        alert(
          "Customer name is not set in Admin Settings."
        );

        return;

      }


      /*
        AMOUNT CHECK
      */

      const amount =
        Number(savedAmount);


      if (!amount || amount <= 0) {

        alert(
          "Amount is not set in Admin Settings."
        );

        return;

      }


      /*
        UPI CHECK
      */

      if (!upiId) {

        alert(
          "UPI ID is not set in Admin Settings."
        );

        return;

      }


      /*
        CREATE UPI LINK
      */

      const upiLink =
        createUPILink();


      if (!upiLink) {

        alert(
          "Payment settings are not configured."
        );

        return;

      }


      /*
        QR CODE
      */

      const qrUrl =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=300x300&data=" +
        encodeURIComponent(upiLink);


      document.getElementById("qrCode").src =
        qrUrl;


      document.getElementById("upiText").textContent =
        "UPI ID: " + upiId;


      document.getElementById("amountText").textContent =
        "Pay ₹" + amount.toFixed(2);


      /*
        SHOW QR
      */

      document.getElementById("qrBox").style.display =
        "block";


      /*
        HIDE OLD STATUS
      */

      document.getElementById("status").style.display =
        "none";


      /*
        START TIMER
      */

      startQRTimer();

    }


    /*
      START 2 MINUTE TIMER
    */

    function startQRTimer() {

      clearInterval(qrTimer);

      remainingSeconds = 120;

      updateTimer();


      qrTimer =
        setInterval(function() {

          remainingSeconds--;

          updateTimer();


          if (remainingSeconds <= 0) {

            clearInterval(qrTimer);

            paymentFinished();

          }

        }, 1000);

    }


    /*
      UPDATE TIMER
    */

    function updateTimer() {

      const minutes =
        Math.floor(
          remainingSeconds / 60
        );


      const seconds =
        remainingSeconds % 60;


      document.getElementById("timer").textContent =
        "QR Code will close automatically in " +
        minutes +
        ":" +
        String(seconds).padStart(2, "0");

    }


    /*
      CLOSE QR
    */

    function paymentFinished() {

      clearInterval(qrTimer);


      document.getElementById("qrBox").style.display =
        "none";


      const status =
        document.getElementById("status");


      status.textContent =
        "QR Code closed. Payment status is not automatically verified.";


      status.style.display =
        "block";

    }

  </script>

</body>
</html>
