<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UPI Payment</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 94%;
      max-width: 600px;
      margin: 30px auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
      color: #555;
    }

    .details {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
    }

    .row {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .amount {
      color: #087f23;
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .upi {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      margin-top: 6px;
    }

    .pay-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #087f23;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .pay-btn:active {
      transform: scale(.98);
    }

    .qr-box {
      display: none;
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .qr-box img {
      width: 250px;
      max-width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .timer {
      margin-top: 15px;
      font-weight: bold;
      color: #d32f2f;
    }

    .close-btn {
      margin-top: 15px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #555;
      color: white;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #c62828;
      text-align: center;
      font-weight: bold;
      padding: 20px;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 8px;
      color: #795548;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="box">

    <h1>Reliance Finance</h1>

    <div class="subtitle">
      Make payment using UPI
    </div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >
      Loading payment details...
    </div>


    <!-- PAYMENT CONTENT -->

    <div
      id="paymentContent"
      style="display:none;"
    >

      <div class="details">


        <!-- CUSTOMER -->

        <div class="row">

          <strong>
            Customer:
          </strong>

          <div id="customerName">
          </div>

        </div>


        <!-- AMOUNT -->

        <div class="row">

          <strong>
            Amount:
          </strong>

          <div
            id="amount"
            class="amount"
          >
          </div>

        </div>


        <!-- UPI ID -->

        <div class="row">

          <strong>
            UPI ID:
          </strong>

          <div
            id="upiId"
            class="upi"
          >
          </div>

        </div>


      </div>


      <!-- CONTINUE PAYMENT -->

      <button
        class="pay-btn"
        onclick="continuePayment()"
      >
        Continue Payment
      </button>


      <!-- QR BACKUP -->

      <div
        id="qrBox"
        class="qr-box"
      >

        <h3>
          Scan QR Code to Pay
        </h3>

        <img
          id="qrImage"
          alt="UPI QR Code"
        >

        <div
          id="timer"
          class="timer"
        >
        </div>

        <button
          class="close-btn"
          onclick="closeQR()"
        >
          Close QR
        </button>

      </div>


      <div class="note">

        Continue Payment आपके फोन में उपलब्ध UPI
        payment app खोलने की कोशिश करेगा।
        अगर app नहीं खुलता है तो नीचे QR code
        backup के रूप में इस्तेमाल कर सकते हैं।

      </div>


    </div>


    <!-- ERROR -->

    <div
      id="error"
      class="error"
      style="display:none;"
    >
    </div>


  </div>

</div>


<script>


// ==========================================
// VARIABLES
// ==========================================

let customerData = null;

let upiId = "";

let timerInterval = null;

let remainingSeconds = 120;


// ==========================================
// CUSTOMER ID FROM URL
// ==========================================

const params =
  new URLSearchParams(
    window.location.search
  );


const customerId =
  params.get("id");


// ==========================================
// LOAD PAYMENT DATA
// ==========================================

async function loadPaymentData() {

  try {


    // Customer ID check

    if (!customerId) {

      throw new Error(
        "Payment link ID missing"
      );

    }


    // ======================================
    // CUSTOMER DATA
    // ======================================

    const customerResponse =
      await fetch(
        "/api/customer-link/" +
        encodeURIComponent(
          customerId
        ),
        {
          cache: "no-store"
        }
      );


    const customerResult =
      await customerResponse.json();


    if (
      !customerResponse.ok ||
      !customerResult.success
    ) {

      throw new Error(
        "Customer not found"
      );

    }


    customerData =
      customerResult.customer;


    // ======================================
    // UPI SETTINGS
    // ======================================

    const settingsResponse =
      await fetch(
        "/api/settings",
        {
          cache: "no-store"
        }
      );


    const settingsResult =
      await settingsResponse.json();


    if (
      !settingsResponse.ok ||
      !settingsResult.success
    ) {

      throw new Error(
        "UPI settings load नहीं हुई"
      );

    }


    upiId =
      String(
        settingsResult.upi_id || ""
      ).trim();


    if (!upiId) {

      throw new Error(
        "Admin Panel में UPI ID अभी set नहीं है"
      );

    }


    // ======================================
    // SHOW CUSTOMER
    // ======================================

    document.getElementById(
      "customerName"
    ).textContent =
      customerData.name;


    // ======================================
    // SHOW AMOUNT
    // ======================================

    document.getElementById(
      "amount"
    ).textContent =
      "₹" +
      Number(
        customerData.amount
      ).toFixed(2);


    // ======================================
    // SHOW UPI ID
    // ======================================

    document.getElementById(
      "upiId"
    ).textContent =
      upiId;


    // ======================================
    // HIDE LOADING
    // ======================================

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    // ======================================
    // SHOW CONTENT
    // ======================================

    document.getElementById(
      "paymentContent"
    ).style.display =
      "block";


  } catch (error) {

    console.error(
      "Payment load error:",
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    const errorBox =
      document.getElementById(
        "error"
      );


    errorBox.textContent =
      error.message ||
      "Payment details load नहीं हुए";


    errorBox.style.display =
      "block";

  }

}


// ==========================================
// CREATE UPI URL
// ==========================================

function createUPIUrl() {

  const amount =
    Number(
      customerData.amount
    ).toFixed(2);


  const transactionId =
    "PAY" +
    Date.now();


  const upiUrl =
    "upi://pay" +

    "?pa=" +
    encodeURIComponent(
      upiId
    ) +

    "&pn=" +
    encodeURIComponent(
      "Reliance Finance"
    ) +

    "&am=" +
    encodeURIComponent(
      amount
    ) +

    "&cu=INR" +

    "&tr=" +
    encodeURIComponent(
      transactionId
    );


  return upiUrl;

}


// ==========================================
// CONTINUE PAYMENT
// ==========================================

function continuePayment() {

  if (!customerData) {

    alert(
      "Customer details अभी तैयार नहीं हैं।"
    );

    return;

  }


  if (!upiId) {

    alert(
      "UPI ID उपलब्ध नहीं है।"
    );

    return;

  }


  const upiUrl =
    createUPIUrl();


  /*
    Android में UPI application खोलने की कोशिश।
    उपलब्ध UPI apps के अनुसार Android chooser
    दिखा सकता है।
  */

  window.location.href =
    upiUrl;


  /*
    अगर UPI app नहीं खुलता है तो कुछ समय बाद
    QR backup दिखाएँ।
  */

  setTimeout(function() {

    showQRCode();

  }, 1800);

}


// ==========================================
// SHOW QR CODE
// ==========================================

function showQRCode() {

  if (
    !customerData ||
    !upiId
  ) {

    return;

  }


  const upiUrl =
    createUPIUrl();


  const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/" +

    "?size=300x300&data=" +

    encodeURIComponent(
      upiUrl
    );


  document.getElementById(
    "qrImage"
  ).src =
    qrUrl;


  document.getElementById(
    "qrBox"
  ).style.display =
    "block";


  startTimer();

}


// ==========================================
// START QR TIMER
// ==========================================

function startTimer() {

  clearInterval(
    timerInterval
  );


  remainingSeconds =
    120;


  updateTimer();


  timerInterval =
    setInterval(
      function() {

        remainingSeconds--;


        updateTimer();


        if (
          remainingSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );


          document.getElementById(
            "qrBox"
          ).style.display =
            "none";

        }

      },
      1000
    );

}


// ==========================================
// UPDATE TIMER
// ==========================================

function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds / 60
    );


  const seconds =
    remainingSeconds % 60;


  document.getElementById(
    "timer"
  ).textContent =

    "QR expires in " +

    minutes +

    ":" +

    String(
      seconds
    ).padStart(
      2,
      "0"
    );

}


// ==========================================
// CLOSE QR
// ==========================================

function closeQR() {

  clearInterval(
    timerInterval
  );


  document.getElementById(
    "qrBox"
  ).style.display =
    "none";

}


// ==========================================
// START
// ==========================================

loadPaymentData();

</script>

</body>

</html>
