<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UPI Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.10);
      text-align: center;
    }

    h1 {
      color: #222;
      margin-bottom: 10px;
    }

    .info-box {
      margin-top: 20px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 12px;
      text-align: left;
    }

    .info-row {
      margin: 10px 0;
      font-size: 17px;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      color: #087f23;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #087f23;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .qr-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    #qrCode {
      width: 240px;
      max-width: 100%;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .upi {
      margin-top: 12px;
      font-weight: bold;
      word-break: break-all;
    }

    .timer {
      color: #c00000;
      font-weight: bold;
    }

    .note {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .close-btn {
      background: #555;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-weight: bold;
    }

    .loading {
      color: #555;
      margin-top: 20px;
    }

    .error {
      color: #c62828;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="siteName">Make Payment</h1>

  <p>Make payment using UPI</p>

  <div id="loading" class="loading">
    Loading payment details...
  </div>

  <div class="info-box">

    <div class="info-row">
      <strong>Customer:</strong>
      <span id="customerName">Loading...</span>
    </div>

    <div class="info-row">
      <strong>Amount:</strong>
      <span id="amount" class="amount">Loading...</span>
    </div>

  </div>

  <button
    id="continueBtn"
    class="btn"
    onclick="continuePayment()"
    disabled>
    Continue Payment
  </button>


  <div id="qrBox" class="qr-box">

    <h2>Scan & Pay</h2>

    <div id="amountText" class="amount"></div>

    <br>

    <img
      id="qrCode"
      alt="UPI QR Code">

    <div
      id="upiText"
      class="upi">
    </div>

    <p id="timer" class="timer">
      QR Code will close automatically in 2:00
    </p>

    <p class="note">
      QR Code को अपने UPI App से scan करके payment करें।
      Payment अपने UPI App में खुद approve करें।
      UPI PIN/OTP केवल अपने UPI App में ही डालें।
    </p>

    <button
      class="btn close-btn"
      onclick="paymentFinished()">
      Close QR
    </button>

  </div>


  <div
    id="status"
    class="status">
  </div>

</div>


<script>

let customerName = "";
let amount = 0;
let customerId = "";

let qrTimer = null;
let remainingSeconds = 120;


/*
  अपनी PAYMENT UPI ID यहाँ डालें
*/

const UPI_ID = "YOUR_UPI_ID";


/*
  LINK से customer ID लेना
  Example:

  payment.html?id=xxxxxxxx
*/

const urlParams =
  new URLSearchParams(
    window.location.search
  );

customerId =
  urlParams.get("id");


/*
  CUSTOMER DATA SERVER से लेना
*/

async function loadCustomer() {

  if (!customerId) {

    showError(
      "Payment link में customer ID नहीं है।"
    );

    return;
  }


  try {

    const response =
      await fetch(
        "/api/customer-link/" +
        encodeURIComponent(
          customerId
        ),
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Customer not found"
      );

    }


    const customer =
      data.customer;


    customerName =
      customer.name;


    amount =
      Number(customer.amount);


    /*
      Customer name
    */

    document.getElementById(
      "customerName"
    ).textContent =
      customerName;


    /*
      Amount
    */

    document.getElementById(
      "amount"
    ).textContent =
      "₹" +
      amount.toFixed(2);


    /*
      Site name
    */

    document.getElementById(
      "siteName"
    ).textContent =
      "Reliance finance";


    /*
      Loading हटाना
    */

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    /*
      Button enable
    */

    if (
      customerName &&
      amount > 0
    ) {

      document.getElementById(
        "continueBtn"
      ).disabled =
        false;

    }


  } catch (error) {

    showError(
      "Customer payment details नहीं मिलीं।"
    );

  }

}


/*
  ERROR
*/

function showError(message) {

  const loading =
    document.getElementById(
      "loading"
    );

  loading.textContent =
    message;

  loading.className =
    "error";

}


/*
  UPI LINK
*/

function createUPILink() {

  if (
    !UPI_ID ||
    UPI_ID === "YOUR_UPI_ID"
  ) {

    return null;

  }


  if (
    !amount ||
    amount <= 0
  ) {

    return null;

  }


  const transactionId =
    "PAY" +
    Date.now();


  return (
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(UPI_ID) +
    "&pn=" +
    encodeURIComponent(
      "Reliance finance"
    ) +
    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +
    "&cu=INR" +
    "&tr=" +
    encodeURIComponent(
      transactionId
    )
  );

}


/*
  CONTINUE PAYMENT
*/

function continuePayment() {

  const upiLink =
    createUPILink();


  if (!upiLink) {

    alert(
      "UPI ID अभी payment.html में set नहीं है।"
    );

    return;

  }


  /*
    QR Code
  */

  const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=300x300&data=" +
    encodeURIComponent(
      upiLink
    );


  document.getElementById(
    "qrCode"
  ).src =
    qrUrl;


  document.getElementById(
    "upiText"
  ).textContent =
    "UPI ID: " +
    UPI_ID;


  document.getElementById(
    "amountText"
  ).textContent =
    "Pay ₹" +
    amount.toFixed(2);


  document.getElementById(
    "qrBox"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  startQRTimer();

}


/*
  TIMER
*/

function startQRTimer() {

  clearInterval(qrTimer);

  remainingSeconds = 120;

  updateTimer();


  qrTimer =
    setInterval(function() {

      remainingSeconds--;

      updateTimer();


      if (
        remainingSeconds <= 0
      ) {

        clearInterval(
          qrTimer
        );

        paymentFinished();

      }

    }, 1000);

}


function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds / 60
    );


  const seconds =
    remainingSeconds % 60;


  document.getElementById(
    "timer"
  ).textContent =
    "QR Code will close automatically in " +
    minutes +
    ":" +
    String(seconds).padStart(
      2,
      "0"
    );

}


/*
  CLOSE QR
*/

function paymentFinished() {

  clearInterval(
    qrTimer
  );


  document.getElementById(
    "qrBox"
  ).style.display =
    "none";


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "QR Code closed. Payment status has not been automatically verified.";


  status.style.display =
    "block";

}


/*
  START
*/

loadCustomer();

</script>

</body>
</html>
