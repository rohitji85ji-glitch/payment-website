<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.10);
      text-align: center;
    }

    h1 {
      color: #222;
      margin-bottom: 10px;
    }

    .info-box {
      margin-top: 20px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 12px;
      text-align: left;
    }

    .info-row {
      margin: 10px 0;
      font-size: 17px;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      color: #087f23;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #087f23;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .qr-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    #qrCode {
      width: 240px;
      max-width: 100%;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .upi {
      font-weight: bold;
      margin-top: 12px;
      word-break: break-all;
    }

    .timer {
      color: #c00000;
      font-weight: bold;
      font-size: 17px;
    }

    .note {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .close-btn {
      background: #555;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="siteName">Make Payment</h1>

  <p>Make payment using UPI</p>

  <div class="info-box">

    <div class="info-row">
      <strong>Customer:</strong>
      <span id="customerName"></span>
    </div>

    <div class="info-row">
      <strong>Amount:</strong>
      <span id="amount" class="amount"></span>
    </div>

  </div>

  <button class="btn" onclick="continuePayment()">
    Pay by Any UPI App
  </button>

  <div id="qrBox" class="qr-box">

    <h2>Scan & Pay</h2>

    <div id="amountText" class="amount"></div>

    <br>

    <img id="qrCode" alt="UPI QR Code">

    <div id="upiText" class="upi"></div>

    <p class="timer" id="timer">
      QR Code will close automatically in 2:00
    </p>

    <p class="note">
      अगर UPI app नहीं खुलता है, तो QR Code को
      अपने UPI App से scan करके payment करें।
      UPI PIN/OTP केवल अपने UPI App में डालें।
    </p>

    <button class="btn close-btn" onclick="paymentFinished()">
      Close QR
    </button>

  </div>

  <div id="status" class="status"></div>

</div>


<script>

const customerName =
  localStorage.getItem("customerName");

const siteName =
  localStorage.getItem("siteName");

const upiId =
  localStorage.getItem("upiId");

const savedAmount =
  localStorage.getItem("defaultAmount");

let qrTimer = null;
let remainingSeconds = 120;


document.getElementById("customerName").textContent =
  customerName || "Customer";


if (siteName) {
  document.getElementById("siteName").textContent =
    siteName;
}


const amount =
  Number(savedAmount);


if (amount > 0) {

  document.getElementById("amount").textContent =
    "₹" + amount.toFixed(2);

} else {

  document.getElementById("amount").textContent =
    "Amount not set";

}


/* CREATE UPI LINK */

function createUPILink() {

  if (!upiId || !amount || amount <= 0) {
    return null;
  }

  const transactionId =
    "PAY" + Date.now();

  return (
    "upi://pay" +
    "?pa=" + encodeURIComponent(upiId) +
    "&pn=" + encodeURIComponent(siteName || "Payment") +
    "&am=" + encodeURIComponent(amount.toFixed(2)) +
    "&cu=INR" +
    "&tr=" + encodeURIComponent(transactionId)
  );
}


/* CONTINUE PAYMENT */

function continuePayment() {

  if (!customerName) {
    alert("Customer name is not set.");
    return;
  }

  if (!amount || amount <= 0) {
    alert("Amount is not set.");
    return;
  }

  if (!upiId) {
    alert("UPI ID is not set.");
    return;
  }

  const upiLink =
    createUPILink();

  if (!upiLink) {
    alert("Payment settings are not configured.");
    return;
  }


  /*
    ANDROID UPI INTENT
  */

  if (/Android/i.test(navigator.userAgent)) {

    const query =
      upiLink.substring(
        upiLink.indexOf("?") + 1
      );

    const intentUrl =
      "intent://pay?" +
      query +
      "#Intent;" +
      "scheme=upi;" +
      "action=android.intent.action.VIEW;" +
      "end";

    window.location.href =
      intentUrl;


    /*
      अगर UPI app नहीं खुला,
      तो थोड़ी देर बाद QR दिखाएँ।
    */

    setTimeout(function() {

      showQRCode();

    }, 1800);

    return;
  }


  /*
    NON-ANDROID
  */

  window.location.href =
    upiLink;

}


/* SHOW QR */

function showQRCode() {

  const upiLink =
    createUPILink();

  if (!upiLink) {
    return;
  }

  const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=300x300&data=" +
    encodeURIComponent(upiLink);


  document.getElementById("qrCode").src =
    qrUrl;


  document.getElementById("upiText").textContent =
    "UPI ID: " + upiId;


  document.getElementById("amountText").textContent =
    "Pay ₹" + amount.toFixed(2);


  document.getElementById("qrBox").style.display =
    "block";


  document.getElementById("status").style.display =
    "none";


  startQRTimer();

}


/* TIMER */

function startQRTimer() {

  clearInterval(qrTimer);

  remainingSeconds = 120;

  updateTimer();


  qrTimer = setInterval(function() {

    remainingSeconds--;

    updateTimer();

    if (remainingSeconds <= 0) {

      clearInterval(qrTimer);

      paymentFinished();

    }

  }, 1000);

}


/* UPDATE TIMER */

function updateTimer() {

  const minutes =
    Math.floor(remainingSeconds / 60);

  const seconds =
    remainingSeconds % 60;


  document.getElementById("timer").textContent =
    "QR Code will close automatically in " +
    minutes +
    ":" +
    String(seconds).padStart(2, "0");

}


/* CLOSE QR */

function paymentFinished() {

  clearInterval(qrTimer);

  document.getElementById("qrBox").style.display =
    "none";

  const status =
    document.getElementById("status");

  status.textContent =
    "QR Code closed. Payment status has not been automatically verified.";

  status.style.display =
    "block";

}

</script>

</body>
</html>
