<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UPI Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    h2 {
      margin-top: 5px;
    }

    p {
      color: #555;
    }

    .info-box {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 10px;
      text-align: left;
    }

    .info-row {
      margin: 8px 0;
      font-size: 16px;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      color: #087f23;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #087f23;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .close-btn {
      background: #555;
    }

    .qr-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    #qrCode {
      width: 240px;
      max-width: 100%;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .upi {
      font-weight: bold;
      margin-top: 12px;
      word-break: break-all;
    }

    .payment-message {
      color: #333;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .timer {
      color: #c00000;
      font-weight: bold;
      font-size: 17px;
    }

    .note {
      color: #666;
      font-size: 13px;
      margin-top: 15px;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 id="siteName">Make Payment</h1>

    <p>Make payment using UPI</p>

    <div class="info-box">

      <div class="info-row">
        <strong>Customer:</strong>
        <span id="customerName"></span>
      </div>

      <div class="info-row">
        <strong>Amount:</strong>
        <span class="amount" id="amount"></span>
      </div>

    </div>

    <button class="btn" onclick="showQR()">
      Continue Payment
    </button>

    <div id="qrBox" class="qr-box">

      <h2>Scan & Pay</h2>

      <div id="amountText" class="amount"></div>

      <img
        id="qrCode"
        alt="UPI QR Code"
      >

      <div id="upiText" class="upi"></div>

      <p class="payment-message">
        Please complete your payment within 2 minutes.
      </p>

      <p id="timer" class="timer">
        QR Code will close automatically in 2:00
      </p>

      <p class="note">
        Scan the QR code using your UPI app
        and approve the payment yourself.
      </p>

      <button
        class="btn close-btn"
        onclick="paymentFinished()"
      >
        Payment Done / Close QR
      </button>

    </div>

    <div id="status" class="status"></div>

  </div>

  <script>

    const customerName =
      localStorage.getItem("customerName");

    const siteName =
      localStorage.getItem("siteName");

    const upiId =
      localStorage.getItem("upiId");

    const savedAmount =
      localStorage.getItem("defaultAmount");

    let qrTimer;

    let remainingSeconds = 120;


    // Customer Name
    document.getElementById("customerName")
      .textContent =
      customerName || "Customer";


    // Site Name
    if (siteName) {
      document.getElementById("siteName")
        .textContent = siteName;
    }


    // Amount
    if (savedAmount) {

      document.getElementById("amount")
        .textContent =
        "₹" + Number(savedAmount).toFixed(2);

    } else {

      document.getElementById("amount")
        .textContent =
        "Amount not set";

    }


    function showQR() {

      const amount =
        Number(savedAmount);

      if (!customerName) {
        alert(
          "Customer name is not set in Admin Settings."
        );
        return;
      }

      if (!amount || amount <= 0) {
        alert(
          "Amount is not set in Admin Settings."
        );
        return;
      }

      if (!upiId) {
        alert(
          "UPI ID is not set in Admin Settings."
        );
        return;
      }


      const upiLink =
        "upi://pay" +
        "?pa=" +
        encodeURIComponent(upiId) +
        "&pn=" +
        encodeURIComponent(
          siteName || "Payment"
        ) +
        "&am=" +
        encodeURIComponent(
          amount.toFixed(2)
        ) +
        "&cu=INR";


      const qrUrl =
        "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
        encodeURIComponent(upiLink);


      document.getElementById("qrCode")
        .src = qrUrl;


      document.getElementById("upiText")
        .textContent =
        "UPI ID: " + upiId;


      document.getElementById("amountText")
        .textContent =
        "Pay ₹" + amount.toFixed(2);


      document.getElementById("qrBox")
        .style.display = "block";


      document.getElementById("status")
        .style.display = "none";


      startQRTimer();


      // Mobile पर UPI app खोलने की कोशिश
      if (
        /Android|iPhone|iPad|iPod/i.test(
          navigator.userAgent
        )
      ) {

        setTimeout(function() {

          window.location.href =
            upiLink;

        }, 300);

      }

    }


    function startQRTimer() {

      clearInterval(qrTimer);

      remainingSeconds = 120;

      updateTimer();

      qrTimer =
        setInterval(function() {

          remainingSeconds--;

          updateTimer();

          if (remainingSeconds <= 0) {

            clearInterval(qrTimer);

            paymentFinished();

          }

        }, 1000);

    }


    function updateTimer() {

      const minutes =
        Math.floor(
          remainingSeconds / 60
        );

      const seconds =
        remainingSeconds % 60;


      document.getElementById("timer")
        .textContent =
        "QR Code will close automatically in " +
        minutes +
        ":" +
        String(seconds).padStart(2, "0");

    }


    function paymentFinished() {

      clearInterval(qrTimer);

      document.getElementById("qrBox")
        .style.display = "none";


      const status =
        document.getElementById("status");


      status.textContent =
        "QR Code has been closed. Payment status has not been automatically verified.";


      status.style.display = "block";

    }

  </script>

</body>
</html>
