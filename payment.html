<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    .info-box {
      margin-top: 20px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 12px;
      text-align: left;
    }

    .info-row {
      margin: 10px 0;
      font-size: 17px;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      color: #087f23;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #087f23;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .qr-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    #qrCode {
      width: 240px;
      max-width: 100%;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .upi {
      margin-top: 12px;
      font-weight: bold;
      word-break: break-all;
    }

    .timer {
      color: #c00000;
      font-weight: bold;
      font-size: 17px;
    }

    .note {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .close-btn {
      background: #555;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-weight: bold;
      line-height: 1.5;
    }

    .loading {
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="siteName">Make Payment</h1>

  <p>Make payment using UPI</p>

  <div id="loading" class="loading">
    Loading payment details...
  </div>

  <div class="info-box">

    <div class="info-row">
      <strong>Customer:</strong>
      <span id="customerName">Loading...</span>
    </div>

    <div class="info-row">
      <strong>Amount:</strong>
      <span id="amount" class="amount">Loading...</span>
    </div>

  </div>

  <button
    id="continueBtn"
    class="btn"
    onclick="continuePayment()"
    disabled>
    Continue Payment
  </button>


  <!-- QR -->

  <div id="qrBox" class="qr-box">

    <h2>Scan & Pay</h2>

    <div id="amountText" class="amount"></div>

    <br>

    <img
      id="qrCode"
      alt="UPI QR Code">

    <div
      id="upiText"
      class="upi">
    </div>

    <p class="timer" id="timer">
      QR Code will close automatically in 2:00
    </p>

    <p class="note">
      QR Code को अपने UPI App से scan करके
      payment करें।
      Payment अपने UPI App में खुद approve करें।
      UPI PIN/OTP केवल अपने UPI App में ही डालें।
    </p>

    <button
      class="btn close-btn"
      onclick="paymentFinished()">
      Close QR
    </button>

  </div>


  <div
    id="status"
    class="status">
  </div>

</div>


<script>

let customerName = "";
let siteName = "Make Payment";
let upiId = "";
let savedAmount = "";

let qrTimer = null;
let remainingSeconds = 120;


/*
  SERVER से SETTINGS लाना
*/

async function loadSettings() {

  try {

    const response =
      await fetch("/api/settings", {
        cache: "no-store"
      });


    if (!response.ok) {
      throw new Error("Settings not found");
    }


    const data =
      await response.json();


    customerName =
      data.customerName || "";

    siteName =
      data.siteName || "Make Payment";

    upiId =
      data.upiId || "";

    savedAmount =
      data.defaultAmount || "";


    /*
      CUSTOMER
    */

    document.getElementById(
      "customerName"
    ).textContent =
      customerName || "Customer";


    /*
      SITE NAME
    */

    document.getElementById(
      "siteName"
    ).textContent =
      siteName;


    /*
      AMOUNT
    */

    const amount =
      Number(savedAmount);


    if (amount > 0) {

      document.getElementById(
        "amount"
      ).textContent =
        "₹" + amount.toFixed(2);

    } else {

      document.getElementById(
        "amount"
      ).textContent =
        "Amount not set";

    }


    /*
      LOADING HIDE
    */

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    /*
      BUTTON ENABLE
    */

    if (
      customerName &&
      amount > 0 &&
      upiId
    ) {

      document.getElementById(
        "continueBtn"
      ).disabled = false;

    }


  } catch (error) {

    document.getElementById(
      "loading"
    ).textContent =
      "Payment settings load नहीं हुईं।";


    document.getElementById(
      "customerName"
    ).textContent =
      "Not available";


    document.getElementById(
      "amount"
    ).textContent =
      "Not available";

  }

}


/*
  UPI LINK
*/

function createUPILink() {

  const amount =
    Number(savedAmount);


  if (!upiId) {
    return null;
  }


  if (!amount || amount <= 0) {
    return null;
  }


  const transactionId =
    "PAY" + Date.now();


  const upiLink =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(upiId) +
    "&pn=" +
    encodeURIComponent(siteName) +
    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +
    "&cu=INR" +
    "&tr=" +
    encodeURIComponent(transactionId);


  return upiLink;

}


/*
  CONTINUE PAYMENT
*/

function continuePayment() {

  const amount =
    Number(savedAmount);


  if (!customerName) {

    alert(
      "Customer details are not available."
    );

    return;

  }


  if (!amount || amount <= 0) {

    alert(
      "Amount is not available."
    );

    return;

  }


  if (!upiId) {

    alert(
      "UPI ID is not available."
    );

    return;

  }


  const upiLink =
    createUPILink();


  if (!upiLink) {

    alert(
      "Payment settings are not configured."
    );

    return;

  }


  /*
    QR CODE
  */

  const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=300x300&data=" +
    encodeURIComponent(upiLink);


  document.getElementById(
    "qrCode"
  ).src =
    qrUrl;


  document.getElementById(
    "upiText"
  ).textContent =
    "UPI ID: " + upiId;


  document.getElementById(
    "amountText"
  ).textContent =
    "Pay ₹" + amount.toFixed(2);


  document.getElementById(
    "qrBox"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  startQRTimer();

}


/*
  TIMER START
*/

function startQRTimer() {

  clearInterval(qrTimer);

  remainingSeconds = 120;

  updateTimer();


  qrTimer =
    setInterval(function() {

      remainingSeconds--;

      updateTimer();


      if (remainingSeconds <= 0) {

        clearInterval(qrTimer);

        paymentFinished();

      }

    }, 1000);

}


/*
  TIMER UPDATE
*/

function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds / 60
    );


  const seconds =
    remainingSeconds % 60;


  document.getElementById(
    "timer"
  ).textContent =
    "QR Code will close automatically in " +
    minutes +
    ":" +
    String(seconds).padStart(2, "0");

}


/*
  CLOSE QR
*/

function paymentFinished() {

  clearInterval(qrTimer);


  document.getElementById(
    "qrBox"
  ).style.display =
    "none";


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "QR Code closed. Payment status has not been automatically verified.";


  status.style.display =
    "block";

}


/*
  PAGE LOAD
*/

loadSettings();

</script>

</body>
</html>
